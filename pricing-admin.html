<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing Dashboard | Alan Crew Editz</title><link rel="icon" href="assets/favicon.png?v=2"><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eefaff;font-family:Arial,sans-serif}body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 20% 25%,#0070ff44,transparent 28%),radial-gradient(circle at 75% 70%,#00d9ff33,transparent 30%);filter:blur(65px);animation:bg 12s ease-in-out infinite alternate}@keyframes bg{to{transform:translate(4%,3%) scale(1.08)}}header{width:min(1100px,92%);margin:14px auto 0;padding:16px 20px;border:1px solid #0099ff44;border-radius:20px;background:#02070fd9;display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:10px;z-index:5;backdrop-filter:blur(18px)}header a{color:#45b9ff;text-decoration:none;font-weight:800}.wrap{width:min(1100px,92%);margin:auto;padding:40px 0 70px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 8px}.hero p,.note{color:#91a9bd;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:24px}.panel{padding:22px;border:1px solid #0099ff33;border-radius:18px;background:#020810cc;box-shadow:0 18px 60px #0008}.panel h2{margin-top:0;color:#35baff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#8fb1c6;margin:13px 0 6px}input{width:100%;padding:11px;border-radius:9px;border:1px solid #0099ff33;background:#050b14;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{border:0;border-radius:10px;padding:12px 15px;font-weight:800;cursor:pointer}.save{background:linear-gradient(100deg,#0070ff,#00d9ff);color:#001018}.secondary{background:#071321;color:#bff8ff;border:1px solid #00d9ff33}.status{margin-top:14px;color:#63d7ff;font-size:.8rem}.preview{margin-top:28px}.code{white-space:pre-wrap;max-height:280px;overflow:auto;padding:15px;border-radius:12px;background:#03060b;border:1px solid #ffffff12;color:#9ddfff;font:12px/1.6 monospace}@media(max-width:750px){.grid,.row{grid-template-columns:1fr}header{position:relative;top:0}}
</style></head><body><header><a href="index.html">ALAN CREW EDITZ</a><nav><a href="pricing.html">Pricing ↗</a></nav></header><main class="wrap"><section class="hero"><div class="note">ADMIN · PRICING CONTROL</div><h1>Edit <span style="color:#29b8ff">pricing.js</span></h1><p>මේ page එකෙන් prices වෙනස් කරලා <b>Download pricing.js</b> කරන්න. Download කරන file එක GitHub repository එකේ existing <b>pricing.js</b> වෙනුවට replace කළාම live pricing + calculator එක update වෙනවා.</p></section><div id="panels" class="grid"></div><div class="actions"><button class="save" id="download">Download pricing.js</button><button class="secondary" id="reset">Reset</button></div><div class="status" id="status"></div><section class="preview panel"><h2>Generated File Preview</h2><div class="code" id="preview"></div></section></main><script src="pricing.js"></script><script>
const KEY='s04-pricing-admin-v1';let base=JSON.parse(JSON.stringify(window.PRICING_DATA));let data=JSON.parse(localStorage.getItem(KEY)||'null')||base;const panels=document.getElementById('panels');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function render(){panels.innerHTML='';
 data.membership.forEach((m,i)=>panels.innerHTML+=`<section class="panel"><h2>Membership ${i+1} · ${esc(m.name)}</h2><div class="row"><div><label>Monthly price LKR</label><input data-k="membership.${i}.price" type="number" value="${m.price}"></div><div><label>Days</label><input data-k="membership.${i}.days" type="number" value="${m.days}"></div><div><label>Videos / day</label><input data-k="membership.${i}.videosPerDay" type="number" value="${m.videosPerDay}"></div><div><label>Max minutes / video</label><input data-k="membership.${i}.maxMinutes" type="number" value="${m.maxMinutes}"></div><div><label>Normal per-video value LKR</label><input data-k="membership.${i}.normalPerVideo" type="number" value="${m.normalPerVideo}"></div></div></section>`);
 ['video','graphic'].forEach(type=>data[type].forEach((x,i)=>panels.innerHTML+=`<section class="panel"><h2>${type==='video'?'Video':'Graphic'} · ${esc(x.name)}</h2><label>Price LKR</label><input data-k="${type}.${i}.price" type="number" value="${x.price}"><div class="row"><div><label>Duration / size</label><input data-k="${type}.${i}.duration" value="${esc(x.duration)}"></div><div><label>Requirement</label><input data-k="${type}.${i}.requirement" value="${esc(x.requirement)}"></div><div><label>Delivery</label><input data-k="${type}.${i}.delivery" value="${esc(x.delivery)}"></div></div></section>`));
 panels.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{setValue(el.dataset.k,el.value);updatePreview()}));updatePreview()}
function setValue(path,val){let [a,b,c]=path.split('.');let target=data[a][+b];if(c==='price'||c==='days'||c==='videosPerDay'||c==='maxMinutes'||c==='normalPerVideo') target[c]=Number(val)||0;else target[c]=val}
function updatePreview(){document.getElementById('preview').textContent='window.PRICING_DATA = '+JSON.stringify(data,null,2)+';'}
document.getElementById('download').onclick=()=>{const blob=new Blob(['// Generated by Pricing Dashboard\nwindow.PRICING_DATA = '+JSON.stringify(data,null,2)+';\n'],{type:'text/javascript'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='pricing.js';a.click();URL.revokeObjectURL(u);localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('status').textContent='pricing.js downloaded. Replace the GitHub file with this copy.'};
document.getElementById('reset').onclick=()=>{localStorage.removeItem(KEY);data=JSON.parse(JSON.stringify(base));render();document.getElementById('status').textContent='Reset complete.'};render();
</script></body></html>
