<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project · Alan Crew Editz</title><style>
:root{--bg:#020712;--panel:#071225;--line:rgba(0,208,224,.18);--cyan:#00d0e0;--blue:#0070b0;--text:#f3f8ff;--muted:#9fb5c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 15%,rgba(0,208,224,.12),transparent 30%),radial-gradient(circle at 80% 75%,rgba(0,112,176,.16),transparent 35%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}a{text-decoration:none;color:inherit}.wrap{width:min(1180px,92%);margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--line);background:rgba(2,7,18,.75);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}.top-inner{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-weight:900;letter-spacing:.08em}.logo span{color:var(--cyan)}.back{padding:9px 14px;border:1px solid var(--line);border-radius:10px;color:#c9f8ff;background:rgba(0,112,176,.12)}main{padding:55px 0 80px}.crumb{font-size:.7rem;text-transform:uppercase;letter-spacing:.16em;color:var(--cyan);margin-bottom:12px}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,.8fr);gap:28px;align-items:start}.media{background:#000;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.35)}.media iframe{width:100%;aspect-ratio:16/9;display:block;border:0}.media img{width:100%;height:auto;display:block}.empty{aspect-ratio:16/9;display:grid;place-items:center;color:var(--muted)}.details{background:linear-gradient(145deg,rgba(0,45,104,.75),rgba(0,27,77,.72));border:1px solid var(--line);border-radius:20px;padding:28px;position:sticky;top:105px}.details h1{font-size:clamp(1.7rem,3vw,2.5rem);line-height:1.12;margin:0 0 12px}.desc{color:var(--muted);line-height:1.75;font-size:.95rem;white-space:pre-line}.dates{display:grid;gap:10px;margin:22px 0}.date{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.18)}.date small{display:block;color:var(--cyan);font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}.date b{font-size:.9rem}.tags,.links{display:flex;flex-wrap:wrap;gap:7px}.pill,.link{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:.68rem}.link{border-radius:9px;color:#d8fbff;background:rgba(0,176,208,.1)}.links{margin-top:22px}.note{margin-top:28px;color:#7890a5;font-size:.72rem}@media(max-width:820px){main{padding-top:35px}.layout{grid-template-columns:1fr}.details{position:static}.top-inner{align-items:flex-start}.media{border-radius:14px}.details{border-radius:14px;padding:22px}}
</style><script src="projects.js"></script></head><body><header class="top"><div class="wrap top-inner"><a class="logo" href="index.html">ALAN <span>CREW</span> EDITZ</a><a class="back" href="index.html#projects">← Back to Projects</a></div></header><main class="wrap"><div id="page"></div></main><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function yt(u){const m=(u||'').match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);return m?m[1]:''}function getProjects(){try{const x=localStorage.getItem('alan_projects');if(x)return JSON.parse(x)}catch(e){}return Array.isArray(window.PORTFOLIO_PROJECTS)?window.PORTFOLIO_PROJECTS:[]}
const id=new URLSearchParams(location.search).get('id'),p=getProjects().find(x=>x.id===id),root=document.getElementById('page');
if(!p){root.innerHTML='<div class="details"><h1>Project not found</h1><p class="desc">This project could not be found.</p></div>'}else{const y=yt(p.video);const media=y?`<iframe src="https://www.youtube.com/embed/${y}?rel=0" title="${esc(p.title)} video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`:(p.thumbnail?`<img src="${esc(p.thumbnail)}" alt="${esc(p.title)}">`:'<div class="empty">No preview available</div>');root.innerHTML=`<div class="crumb">${esc(p.category||'Project')}</div><div class="layout"><div class="media">${media}</div><aside class="details"><h1>${esc(p.title)}</h1><p class="desc">${esc(p.description||'')}</p>${(p.startDate||p.endDate)?`<div class="dates">${p.startDate?`<div class="date"><small>Project Started</small><b>${esc(p.startDate)}</b></div>`:''}${p.endDate?`<div class="date"><small>Project Ended</small><b>${esc(p.endDate)}</b></div>`:''}</div>`:''}<div class="tags">${(p.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div><div class="links">${p.demo?`<a class="link" href="${esc(p.demo)}" target="_blank">Live Demo ↗</a>`:''}${p.github?`<a class="link" href="${esc(p.github)}" target="_blank">GitHub ↗</a>`:''}</div><div class="note">Project details and media</div></aside></div>`}
</script></body></html>
